[package]
name = "tqf"
version = "0.0.1"
edition = "2021"
description = "TurboQwenFare: bounded-memory Qwen3.6-35B-A3B inference server"
license = "Apache-2.0"
default-run = "tqf"
build = "build.rs"

[[bin]]
name = "tqf"
path = "src/main.rs"

# Deliberately a single crate: no workspace, no internal sub-crates.
# See spec Part IV, section 23 ("One-crate source tree").

[features]
# Backend selection is compile-time; runtime autodetection picks among
# whatever backends were compiled in. Exactly one of these is expected
# to be enabled per build for now.
default = ["metal"]
metal = ["dep:metal-sys"]
cuda = []
# Compiles and links the adopted SwiftUI GUI (spec §96-98, Phase 46).
# Opt-in (not part of `default`) because it invokes the Swift toolchain
# from build.rs; a headless-only build/CI environment need not have one.
gui = []

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "io-util", "time", "sync"] }
tokio-util = "0.7"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
blake3 = "1"
async-trait = "0.1"
bytes = "1"
tokenizers = "0.23.1"
libc = "0.2.189"
# IEEE-754 binary16 conversions for TQKV per-page quantization scales (spec
# §157-159 store scales as FP16, not BF16 like the reference attention cache).
half = "2"
# Cross-platform filesystem event watching (FSEvents on macOS, inotify
# on Linux) for the retrieval live-sync watcher (spec §42, §199) —
# watcher events are hints, not a source of truth we'd want to
# re-derive kqueue/FSEvents bindings for ourselves.
notify = "6"

# Renamed from the crate's real name "metal" to keep it distinct from this
# manifest's own `metal` compute-backend feature (spec §49: "mature
# Objective-C/Metal bindings for device/queue/resource management").
#
# Target-gated so a plain `cargo build`/`cargo test` works on every
# platform: the `metal` feature is in `default`, but on a non-Apple target
# this dependency is not in the graph at all, so `dep:metal-sys` activates
# nothing and the crate compiles against `backend::reference`. Before this
# gate, a Linux `cargo build` failed inside `core-graphics-types` with
# `error[E0455]: link kind \`framework\` is only supported on Apple targets`.
[target.'cfg(target_os = "macos")'.dependencies]
metal-sys = { package = "metal", version = "0.33", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep unwind (not "abort"): tqf is a long-running server and a panic in
# one request/session must not be able to take down the whole process.

[profile.dev]
opt-level = 0

# Lint policy. Everything not listed here is denied by `just lint`
# (`cargo clippy --all-targets -- -D warnings`), so each allow below is a
# deliberate, reasoned exception rather than accumulated drift.
[lints.clippy]
# The quant/SIMD/attention kernels walk several parallel arrays with one
# counter (weight bytes, per-group scales, per-lane partial sums). Index
# arithmetic is what makes those loops checkable line-by-line against the
# reference math and the GGML block layout they must reproduce exactly;
# zip/iterator chains obscure precisely the relationship that matters.
# Sites: src/simd/mod.rs, src/model/qwen36/{weights,gdn}.rs,
# src/context/tqattn/mod.rs.
needless_range_loop = "allow"
# The `.tqf` writer/reader and the attention kernel take many genuinely
# independent scalars (byte offsets, lengths, checksums, head geometry).
# Bundling them into parameter structs to satisfy a count would hide what
# each call site actually passes, which is the property `format/tqf`'s
# bounds-validation invariants (spec §115 items 2-3) depend on.
too_many_arguments = "allow"
# `BoundMoe` and `QwenRuntimeInstance` dispatch the decode path between a
# resident and a streaming runtime. Boxing the large variant to equalize
# them would add a pointer chase per layer per token on the one loop the
# whole project's tok/s floor is measured on.
large_enum_variant = "allow"
